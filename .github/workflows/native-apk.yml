name: native-release-apk

on:
  workflow_dispatch:
  # Two roles for one build. On a pull request that touches native code it is the gate the
  # execution plan requires ("release APK build on relevant pull requests", NBD-87). On a push to
  # dev it is the publisher: the artefact the owner sideloads to close the section D device
  # matrices. It is deliberately not a required status check, because a paths-filtered workflow
  # never reports on pull requests that miss the filter and would deadlock them. See ADR-0016.
  pull_request:
    paths:
      - 'apps/native/**'
      - 'packages/shared/**'
      - '.github/workflows/native-apk.yml'
  push:
    branches:
      - dev
    paths:
      - 'apps/native/**'
      - 'packages/shared/**'
      - '.github/workflows/native-apk.yml'

concurrency:
  group: native-release-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter apps-native generate:assets
      - run: pnpm --filter apps-native exec expo prebuild --platform android --no-install
      # Release, not debug. A debug React Native APK contains no JS bundle: it expects a Metro
      # dev server on the same network, so installing one standalone shows a red error screen.
      # Release embeds the bundle. Expo's template signs release with the debug keystore, which
      # is fine for owner test builds and is never a Play Store upload key.
      - name: Assemble release APK
        working-directory: apps/native/android
        # Sentry's gradle integration uploads source maps on release builds. There is no auth
        # token in CI and these are owner test builds, so turn the upload off rather than let it
        # fail the build.
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
        run: ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: nabd-apk-${{ github.run_number }}-${{ github.sha }}
          path: apps/native/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

name: native-debug-apk

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/native/**'
      - 'packages/shared/**'
      - '.github/workflows/native-apk.yml'

concurrency:
  group: native-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter apps-native generate:assets
      - run: pnpm --filter apps-native exec expo prebuild --platform android --no-install
      - name: Assemble debug APK
        working-directory: apps/native/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nabd-debug-${{ github.run_number }}-${{ github.sha }}
          path: apps/native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.nabd.device'
version = '1.0.0'

android {
  namespace "expo.modules.nabddevice"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  implementation "androidx.work:work-runtime-ktx:2.9.1"
  testImplementation "junit:junit:4.13.2"
}

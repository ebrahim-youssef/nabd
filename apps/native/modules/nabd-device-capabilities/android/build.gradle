// Mirrors the structure of the first-party Expo modules (see node_modules/expo-localization).
// Omitting defaultConfig left the android library without a release variant, and configuring
// the ':expo' project then failed with "SoftwareComponent with name 'release' not found".
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.nabd.capabilities'
version = '1.0.0'

android {
  namespace "com.nabd.capabilities"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.17.0"
  implementation "androidx.work:work-runtime-ktx:2.11.1"
  implementation "com.google.android.gms:play-services-location:21.3.0"
  implementation 'com.facebook.react:react-android'
}
